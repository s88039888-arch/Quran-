<!DOCTYPE html>
<html lang="ar" dir="rtl" data-t="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7B3FE4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>سكينة — مصحف وأذكار وصلاة وسبحة</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF4E6;--sf:#fff;--ink:#3A2352;--mu:#7D6A93;--ln:#F1DCC8;--ac:#7B3FE4;--co:#FF5C7A;--go:#F59E0B;--so:#FFE6EE;--g:linear-gradient(135deg,#7B3FE4,#FF5C7A);--sh:0 14px 28px -16px rgba(255,92,122,.4);--q:'Amiri Quran','Traditional Arabic',serif;--u:'Tajawal',system-ui,sans-serif}
[data-t=dark]{--bg:#190F2B;--sf:#25173D;--ink:#F6EBFF;--mu:#B7A3D1;--ln:#3B2A5C;--ac:#B794FF;--co:#FF8FA3;--go:#FFC857;--so:#38214F;--g:linear-gradient(135deg,#5B2BB0,#B23A5F)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--u);min-height:100vh}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
[hidden]{display:none!important}
header{background:var(--g);color:#fff;padding:max(14px,env(safe-area-inset-top)) 18px 20px;border-radius:0 0 28px 28px;display:flex;align-items:center;gap:12px;max-width:760px;margin:auto}
header h1{margin:0;font-size:28px;font-weight:800}
.td{margin-inline-start:auto;text-align:end;line-height:1.35;font-size:13px}.td b{display:block;font-size:15px}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid #fff6;background:#fff2;color:#fff;font-size:18px}
main{max-width:760px;margin:auto;padding:16px 14px 110px}
.c{background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.b{background:var(--g);color:#fff;border:0;border-radius:14px;padding:11px 18px;font-weight:700}
.b.g{background:none;color:var(--ink);border:1px solid var(--ln)}
.mu{color:var(--mu);font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:7px 15px}
.chip.on{background:var(--g);color:#fff;border-color:transparent}
input[type=search],select{width:100%;padding:12px 14px;border:1.5px solid var(--ln);border-radius:14px;background:var(--sf);margin-bottom:10px}
.sl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.sl button,.vr{width:100%;text-align:start;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px 14px}
.sl b{font-size:19px}
.n{display:inline-grid;place-items:center;min-width:34px;height:34px;border-radius:50%;background:var(--so);color:var(--co);font-weight:800;font-size:14px}
.rs{display:flex;align-items:center;gap:8px;margin-bottom:10px}.rs h2{flex:1;text-align:center;margin:0;font-size:24px}
.mus{background:var(--sf);border:2px solid var(--go);border-radius:22px;padding:20px 18px}
.fl{margin:0;font-family:var(--q);font-size:var(--f,28px);line-height:2.3;text-align:justify}
.ay{cursor:pointer;border-radius:8px}.ay.hl{background:#F59E0B44}
.nm{display:inline-grid;place-items:center;width:1.5em;height:1.5em;font:700 .5em var(--u);margin:0 .3em;border:1.5px solid var(--go);border-radius:50%;color:var(--go);vertical-align:middle}
.bs{text-align:center;font-family:var(--q);font-size:32px;border-bottom:1px solid var(--ln);margin-bottom:10px}
.vt{font-family:var(--q);font-size:21px;line-height:2.05;display:block}
.rf{color:var(--co);font-weight:800;font-size:14px;display:block}
mark{background:#F59E0B55;color:inherit;border-radius:4px}
.dh{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:12px;cursor:pointer}
.dh.dn{opacity:.55}.dh h4{margin:0 0 4px;color:var(--co)}
.dt{font-family:var(--q);font-size:23px;line-height:2.05;margin:0}
.df{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px dashed var(--ln);color:var(--mu);font-size:14px}.df b{color:var(--ac);font-size:18px}
.pb{height:12px;border-radius:9px;background:var(--so);overflow:hidden}.pb i{display:block;height:100%;background:var(--g)}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dd{--h:0;position:relative;border-radius:20px;padding:14px;min-height:130px;background:hsl(var(--h) 85% 92%);color:hsl(var(--h) 55% 22%);border:2px solid hsl(var(--h) 60% 80%);display:flex;flex-direction:column;gap:6px;cursor:pointer}
[data-t=dark] .dd{background:hsl(var(--h) 38% 20%);color:hsl(var(--h) 70% 88%);border-color:hsl(var(--h) 38% 30%)}
.dd.on{background:hsl(var(--h) 58% 38%);color:#fff;border-color:transparent}
.dd span:first-child{font-size:28px}.dd .t{font-weight:700;flex:1}.dd small{opacity:.9}
.ph{background:var(--g);color:#fff;border-radius:26px;padding:20px;text-align:center;margin-bottom:14px;box-shadow:var(--sh)}
.ph h2{font-size:34px;margin:2px 0}.ph .cd{display:inline-block;background:#fff3;border-radius:99px;padding:4px 18px;font-weight:700;margin-top:6px}
.pr{display:flex;justify-content:space-between;padding:13px 16px;margin-bottom:8px;border-radius:18px;background:var(--sf);border:1px solid var(--ln);font-size:18px;font-weight:700}
.pr span:last-child{color:var(--ac)}.pr.s{opacity:.65;font-weight:400}
.pr.x{background:linear-gradient(135deg,#FFE3EA,#FFF0C9);border-color:var(--co);color:#3A2352}.pr.x span:last-child{color:#C2185B}
.rg{position:relative;width:min(80vw,300px);aspect-ratio:1;margin:8px auto}
.rg svg{position:absolute;inset:0;transform:rotate(-90deg)}
.tb{position:absolute;inset:12%;border-radius:50%;border:2px solid var(--go);background:var(--sf);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center}
.tb .p{font-family:var(--q);font-size:20px;padding:0 12px;text-align:center}.tb .k{font-size:64px;font-weight:800;color:var(--ac);line-height:1.1}
.wk,.gr{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.wk span{text-align:center;font-size:12px;color:var(--mu);font-weight:700}
.dy{aspect-ratio:1/1.1;border:1px solid var(--ln);background:var(--sf);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.dy b{font-size:18px}.dy i{font-style:normal;font-size:10px;color:var(--mu)}.dy.f b{color:var(--ac)}.dy.e{border-color:var(--co)}
.dy.t{background:var(--g);color:#fff}.dy.t i,.dy.t b{color:#fff}.dy.s{outline:2.5px solid var(--go)}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--ln)}
nav{position:fixed;inset-inline:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);z-index:9;padding-bottom:env(safe-area-inset-bottom)}
nav div{display:grid;grid-template-columns:repeat(7,1fr);max-width:760px;margin:auto}
nav button{background:none;border:0;padding:7px 0;font-size:10.5px;color:var(--mu);display:flex;flex-direction:column;align-items:center}
nav button span{font-size:21px}nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px var(--co)}
#to{position:fixed;inset-inline:0;bottom:90px;text-align:center;pointer-events:none;z-index:20}
#to span{background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;opacity:0;transition:.25s}#to.s span{opacity:1}
.fn{text-align:center;color:var(--mu);font-size:13px}
</style>
</head>
<body>
<header><h1>✨ سكينة</h1><div class="td"><b id="th"></b><span id="tg"></span></div><button class="ib" id="tm" aria-label="تبديل المظهر">🌓</button></header>
<main>
<section class="tab" id="t-quran"></section>
<section class="tab" id="t-search" hidden><input id="q" type="search" placeholder="كلمة من آية، أو اسم سورة، أو ٢:٢٥٥"><div id="sr"></div></section>
<section class="tab" id="t-adhkar" hidden></section>
<section class="tab" id="t-deeds" hidden></section>
<section class="tab" id="t-prayer" hidden></section>
<section class="tab" id="t-tasbih" hidden></section>
<section class="tab" id="t-cal" hidden></section>
</main>
<nav><div id="nv"></div></nav>
<div id="to"><span></span></div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const A=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const L2=s=>s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const mem={};
const LS={get(k,d){if(k in mem)return mem[k];try{const v=localStorage.getItem('sakina:'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('sakina:'+k,JSON.stringify(v));delete mem[k]}catch(e){mem[k]=v}}};
const toast=m=>{const t=$('#to');t.firstChild.textContent=m;t.classList.add('s');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('s'),2000)};
const buzz=p=>{if(LS.get('hap',true)&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};
const DI=/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g;
const norm=s=>s.replace(DI,'').replace(/[إأآٱ]/g,'ا').replace(/[ىی]/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/\s+/g,' ').trim();
const dk=(d=new Date())=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();

/* السور */
const SU="الفاتحة 7|البقرة 286|آل عمران 200|النساء 176|المائدة 120|الأنعام 165|الأعراف 206|الأنفال 75|التوبة 129|يونس 109|هود 123|يوسف 111|الرعد 43|إبراهيم 52|الحجر 99|النحل 128|الإسراء 111|الكهف 110|مريم 98|طه 135|الأنبياء 112|الحج 78|المؤمنون 118|النور 64|الفرقان 77|الشعراء 227|النمل 93|القصص 88|العنكبوت 69|الروم 60|لقمان 34|السجدة 30|الأحزاب 73|سبأ 54|فاطر 45|يس 83|الصافات 182|ص 88|الزمر 75|غافر 85|فصلت 54|الشورى 53|الزخرف 89|الدخان 59|الجاثية 37|الأحقاف 35|محمد 38|الفتح 29|الحجرات 18|ق 45|الذاريات 60|الطور 49|النجم 62|القمر 55|الرحمن 78|الواقعة 96|الحديد 29|المجادلة 22|الحشر 24|الممتحنة 13|الصف 14|الجمعة 11|المنافقون 11|التغابن 18|الطلاق 12|التحريم 12|الملك 30|القلم 52|الحاقة 52|المعارج 44|نوح 28|الجن 28|المزمل 20|المدثر 56|القيامة 40|الإنسان 31|المرسلات 50|النبأ 40|النازعات 46|عبس 42|التكوير 29|الانفطار 19|المطففين 36|الانشقاق 25|البروج 22|الطارق 17|الأعلى 19|الغاشية 26|الفجر 30|البلد 20|الشمس 15|الليل 21|الضحى 11|الشرح 8|التين 8|العلق 19|القدر 5|البينة 8|الزلزلة 8|العاديات 11|القارعة 11|التكاثر 8|العصر 3|الهمزة 9|الفيل 5|قريش 4|الماعون 7|الكوثر 3|الكافرون 6|النصر 3|المسد 5|الإخلاص 4|الفلق 5|الناس 6".split('|').map(x=>{const i=x.lastIndexOf(' ');return[x.slice(0,i),+x.slice(i+1)]});
const SN=SU.map(s=>norm(s[0]));
let Q=null,READ=null,dling=false;
const validQ=d=>{if(!d||!d.u||!d.n||d.u.length!==114||d.n.length!==114)return false;let t=0;for(let i=0;i<114;i++){if(d.u[i].length!==SU[i][1]||d.n[i].length!==SU[i][1])return false;t+=d.u[i].length}return t===6236};
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('sakina',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const idbGet=async k=>{const db=await idb();return new Promise((r,j)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})};
const idbSet=async(k,v)=>{const db=await idb();return new Promise((r,j)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r;t.onerror=()=>j(t.error)})};
const strip=(t,s,a)=>{if(a!==1||s===1||s===9)return t.trim();const k=t.trim().split(/\s+/);return norm(k[0])==='بسم'?k.slice(4).join(' '):t.trim()};
async function download(){
  if(dling||Q)return;dling=true;$$('[data-dl]').forEach(b=>b.disabled=true);setDl('جارٍ تحميل نص المصحف…');
  try{
    const r=await fetch('https://api.alquran.cloud/v1/quran/quran-uthmani');if(!r.ok)throw new Error('الخادم '+r.status);
    const j=await r.json();if(j.code!==200||!j.data||j.data.surahs.length!==114)throw new Error('رد غير متوقع');
    const d={u:[],n:[],t:[]};
    j.data.surahs.forEach((s,i)=>{const u=s.ayahs.map((x,k)=>strip(x.text,i+1,k+1));d.u.push(u);d.n.push(u.map(norm));d.t.push(s.revelationType==='Meccan'?'مكية':'مدنية')});
    if(!validQ(d))throw new Error('عدد الآيات لا يطابق المصحف (٦٢٣٦)');
    Q=d;try{await idbSet('quran-v1',d)}catch(e){}
    toast('تم تحميل المصحف والتحقق من اكتماله');renderAll();
  }catch(e){setDl('تعذّر التحميل: '+(e.message||e)+'. تأكد من الإنترنت ثم أعد المحاولة.');$$('[data-dl]').forEach(b=>b.disabled=false)}
  finally{dling=false}
}
const setDl=t=>$$('.dls').forEach(e=>e.textContent=t);
const dlCard=()=>`<div class="c"><h3 style="margin:0 0 6px">حمّل المصحف مرة واحدة</h3><p class="mu">يُحفظ على جهازك ثم يعمل دون إنترنت، ويُتحقق من اكتمال ٦٢٣٦ آية.</p><button class="b" data-dl>تحميل المصحف</button><p class="mu dls"></p></div>`;

/* التبويبات */
const TABS=[['quran','📖','المصحف'],['search','🔎','بحث'],['adhkar','✨','الأذكار'],['deeds','💝','الخير'],['prayer','🕌','الصلاة'],['tasbih','📿','السبحة'],['cal','📅','التقويم']];
$('#nv').innerHTML=TABS.map(t=>`<button data-tab="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('');
function show(t){LS.set('tab',t);$$('.tab').forEach(e=>e.hidden=e.id!=='t-'+t);$$('#nv button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));scrollTo(0,0)}
function theme(){let t=LS.get('theme',null)||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.t=t;$('meta[name=theme-color]').content=t==='dark'?'#3A1D6E':'#7B3FE4'}
$('#tm').onclick=()=>{LS.set('theme',document.documentElement.dataset.t==='dark'?'light':'dark');theme()};

/* المصحف */
function rQuran(){
  if(READ)return rRead();
  const l=LS.get('last',null);let h=Q?'':dlCard();
  if(Q&&l)h+=`<button class="b" style="width:100%;margin-bottom:12px;display:flex;justify-content:space-between" data-o="${l.s}:${l.a}"><span>متابعة القراءة</span><b>${SU[l.s-1][0]} · ${A(l.a)}</b></button>`;
  h+=`<input type="search" id="sf" placeholder="تصفية السور بالاسم أو الرقم"><ol class="sl">${SU.map((s,i)=>`<li data-n="${SN[i]}" data-i="${i+1}"><button data-o="${i+1}:1"><span class="n">${A(i+1)}</span><b style="flex:1">${s[0]}</b><span class="mu">${A(s[1])} آية${Q?' · '+Q.t[i]:''}</span></button></li>`).join('')}</ol>`;
  $('#t-quran').innerHTML=h;
}
function rRead(){
  const{s,a}=READ,u=Q.u[s-1];document.documentElement.style.setProperty('--f',LS.get('fs',28)+'px');
  $('#t-quran').innerHTML=`<div class="rs"><button class="b g" id="bk">‹ السور</button><h2>سورة ${SU[s-1][0]}</h2><button class="b g" id="fm">أ-</button><button class="b g" id="fp">أ+</button></div>
  <article class="mus">${s!==1&&s!==9?'<div class="bs">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>':''}<p class="fl">${u.map((t,i)=>`<span class="ay" data-a="${i+1}">${E(t)}<span class="nm">${A(i+1)}</span></span>`).join(' ')}</p></article>
  <p class="fn">اضغط على أي آية لحفظ موضع القراءة</p>
  <div style="display:flex;justify-content:space-between;gap:10px">${s>1?`<button class="b g" data-o="${s-1}:1">‹ ${SU[s-2][0]}</button>`:'<i></i>'}${s<114?`<button class="b g" data-o="${s+1}:1">${SU[s][0]} ›</button>`:''}</div>`;
  if(a>1){const e=$(`.ay[data-a="${a}"]`);if(e){e.scrollIntoView({block:'center'});e.classList.add('hl');setTimeout(()=>e.classList.remove('hl'),2500)}}else scrollTo(0,0);
}
function openS(s,a){if(!Q){show('quran');READ=null;rQuran();toast('حمّل المصحف أولًا');return}READ={s,a:Math.min(Math.max(a||1,1),SU[s-1][1])};show('quran');rRead()}

/* البحث */
function rSearch(){doSearch()}
function doSearch(){
  const box=$('#sr'),q0=L2($('#q').value).trim();
  if(!Q){box.innerHTML=dlCard();return}
  if(!q0){box.innerHTML='<p class="mu" style="text-align:center">اكتب كلمة أو جزءًا من آية، أو اسم سورة، أو رقمها مثل ٢:٢٥٥</p>';return}
  let h='',m=q0.match(/^(\d{1,3})\s*[:\/\-.،]\s*(\d{1,3})$/);
  if(m){const s=+m[1],a=+m[2];if(s>=1&&s<=114&&a>=1&&a<=SU[s-1][1])h+=`<button class="vr" data-o="${s}:${a}"><span><span class="rf">${SU[s-1][0]} · ${A(a)}</span><span class="vt">${E(Q.u[s-1][a-1])}</span></span></button>`;else h+='<p class="mu">هذه الآية غير موجودة.</p>'}
  const nq=norm(q0.replace(/^سورة\s+/,''));
  if(!/^\d/.test(nq)&&nq.length>=2){SN.forEach((x,i)=>{if(x.replace(/^ال/,'').includes(nq.replace(/^ال/,'')))h+=`<button class="vr" data-o="${i+1}:1"><b>سورة ${SU[i][0]}</b><span class="mu">${A(SU[i][1])} آية</span></button>`})}
  if(!m&&nq.replace(/ /g,'').length>=2&&!/^\d+$/.test(nq)){
    const w=nq.split(' ').map(x=>x.replace(/^ال/,'')).filter(x=>x.length>=2),it=[];
    if(w.length)for(let s=0;s<114;s++)Q.n[s].forEach((t,a)=>{if(w.every(x=>t.includes(x)))it.push([s+1,a+1])});
    h+=it.length?`<p class="mu">${A(it.length)} نتيجة${it.length>40?' (أول ٤٠)':''}</p>`+it.slice(0,40).map(([s,a])=>{const u=Q.u[s-1][a-1],un=u.split(/\s+/),nn=Q.n[s-1][a-1].split(' ');const t=un.length===nn.length?un.map((x,i)=>w.some(y=>nn[i].includes(y))?`<mark>${E(x)}</mark>`:E(x)).join(' '):E(u);return`<button class="vr" data-o="${s}:${a}"><span><span class="rf">${SU[s-1][0]} · ${A(a)}</span><span class="vt">${t}</span></span></button>`}).join(''):(h?'':'<p class="mu" style="text-align:center">لا نتائج. جرّب كلمة أقصر.</p>');
  }
  box.innerHTML=h||'<p class="mu" style="text-align:center">لا نتائج.</p>';
}

/* الأذكار */

const CITIES={'القاهرة':[30.04,31.24],'الإسكندرية':[31.20,29.92],'المنصورة':[31.04,31.38],'طنطا':[30.79,31.00],'الإسماعيلية':[30.60,32.27],'بورسعيد':[31.27,32.30],'السويس':[29.97,32.55],'أسيوط':[27.18,31.18],'الأقصر':[25.70,32.64],'أسوان':[24.09,32.90]};

const rad=x=>x*Math.PI/180,deg=x=>x*180/Math.PI;
function hours(date,lat,lng){
  const tz=-date.getTimezoneOffset()/60,D=Date.UTC(date.getFullYear(),date.getMonth(),date.getDate(),12)/864e5+2440587.5-2451545;
  const g=rad((357.529+0.98560028*D)%360),q=(280.459+0.98564736*D)%360,Lm=rad((q+1.915*Math.sin(g)+0.02*Math.sin(2*g))%360),e=rad(23.439-3.6e-7*D);
  const dec=Math.asin(Math.sin(e)*Math.sin(Lm)),ra=(deg(Math.atan2(Math.cos(e)*Math.sin(Lm),Math.cos(Lm)))/15+24)%24;
  const eq=(((q/15-ra)+12)%24+24)%24-12,nn=12+tz-lng/15-eq,f=rad(lat);
  const T=a=>{const c=(Math.sin(rad(a))-Math.sin(dec)*Math.sin(f))/(Math.cos(dec)*Math.cos(f));return deg(Math.acos(Math.min(1,Math.max(-1,c))))/15};
  const as=deg(Math.atan(1/(1+Math.tan(Math.abs(f-dec)))));
  return[nn-T(-19.5),nn-T(-.833),nn+.0167,nn+T(as),nn+T(-.833)+.0167,nn+T(-17.5)];
}
const pDay=(y,m,d,la,ln)=>{const b=new Date(y,m,d);return hours(b,la,ln).map(h=>new Date(b.getTime()+Math.round(h*36e5)))};

function qib(lat,lng){const a=rad(lat),b=rad(21.4225),dl=rad(39.8262-lng);return(deg(Math.atan2(Math.sin(dl)*Math.cos(b),Math.cos(a)*Math.sin(b)-Math.sin(a)*Math.cos(b)*Math.cos(dl)))+360)%360}

  ${PRN.map((x,i)=>`<div class="pr ${i===1?'s':''} ${i===ni?'x':''}"><span>${i===2&&fr?'الجمعة':x}</span><span>${fT(t[i])}</span></div>`).join('')}

}
function uT(){const p=T.tg?Math.min(T.c/T.tg,1):(T.c%100)/100;$('#pg2').style.strokeDashoffset=RC*(1-p);$('#tk').textContent=A(T.c);$('#tt').textContent=T.tg?(T.c>=T.tg?'اكتملت الدورة':'من '+A(T.tg)):'بلا حد';$('#tm2').textContent='الدورات: '+A(T.r)+' · إجمالي هذا الذكر: '+A(T.tot[T.p]||0)}
function tap(){if(T.tg&&T.c>=T.tg)T.c=0;T.c++;T.tot[T.p]=(T.tot[T.p]||0)+1;if(T.tg&&T.c>=T.tg){T.r++;buzz([70,40,70])}else buzz(12);LS.set('tasbih',T);uT()}

/* التقويم الهجري */
const HM=['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'],GM=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'],WD=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'],WK=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
let HF=null;try{HF=new Intl.DateTimeFormat('en-US-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'numeric',year:'numeric'});HF.format(new Date())}catch(e){HF=null}
const hij=d=>{const o={};HF.formatToParts(d).forEach(p=>o[p.type]=p.value);return{y:+o.year,m:+o.month,d:+o.day}};
const nn=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),12),ad=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return nn(x)};
const EV={'1-1':'رأس السنة الهجرية','1-10':'يوم عاشوراء','3-12':'المولد النبوي (على المشهور)','7-27':'الإسراء والمعراج (على المشهور)','9-1':'أول رمضان','10-1':'عيد الفطر','12-9':'يوم عرفة','12-10':'عيد الأضحى'};
let CR=nn(new Date()),CS=nn(new Date());
function evs(d){const h=hij(d),o=[];if(EV[h.m+'-'+h.d])o.push(EV[h.m+'-'+h.d]);if(h.m===9&&h.d>=21)o.push('من العشر الأواخر');if([13,14,15].includes(h.d)&&!(h.m===12&&h.d===13))o.push('من الأيام البيض');return o}
function rCal(){
  if(!HF){$('#t-cal').innerHTML='<div class="c">متصفحك لا يدعم التاريخ الهجري.</div>';return}
  const h0=hij(CR);let d=ad(CR,-(h0.d-1));const days=[];while(hij(d).m===h0.m&&days.length<31){days.push(d);d=ad(d,1)}
  const td=nn(new Date()),off=(days[0].getDay()+1)%7,sh=hij(CS),se=evs(CS);
  const ms=days.map(x=>({x,e:evs(x).filter(t=>!/الأيام|العشر/.test(t))})).filter(o=>o.e.length);
  $('#t-cal').innerHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><button class="b g" data-cn="1">›</button><div style="flex:1;text-align:center"><h2 style="margin:0">${HM[h0.m-1]} ${A(h0.y)} هـ</h2><span class="mu">${GM[days[0].getMonth()]} ${A(days[0].getFullYear())} م</span></div><button class="b g" data-cn="-1">‹</button></div>
  <div class="wk">${WK.map(w=>`<span>${w}</span>`).join('')}</div><div class="gr">${'<span></span>'.repeat(off)}${days.map(x=>{const h=hij(x);return`<button class="dy ${x.getDay()===5?'f':''} ${evs(x).length?'e':''} ${x.getTime()===td.getTime()?'t':''} ${x.getTime()===CS.getTime()?'s':''}" data-cd="${x.getTime()}"><b>${A(h.d)}</b><i>${x.getDate()===1?GM[x.getMonth()]:A(x.getDate())}</i></button>`}).join('')}</div>
  <p style="text-align:center"><button class="chip" data-cn="0">اليوم</button></p>
  <div class="c"><h3 style="margin:0">${WD[CS.getDay()]} ${A(sh.d)} ${HM[sh.m-1]} ${A(sh.y)} هـ</h3><span class="mu">${A(CS.getDate())} ${GM[CS.getMonth()]} ${A(CS.getFullYear())} م</span>${se.concat([1,4].includes(CS.getDay())?['يُستحب صيام الاثنين والخميس']:[]).map(t=>`<div class="row">${t}</div>`).join('')}</div>
  ${ms.length?`<div class="c"><h3 style="margin:0 0 6px">مناسبات الشهر</h3>${ms.map(o=>`<div class="row"><span>${o.e.join('، ')}</span><span class="mu">${A(o.x.getDate())} ${GM[o.x.getMonth()]}</span></div>`).join('')}</div>`:''}
  <p class="fn">التاريخ الهجري بتقويم أم القرى وقد يختلف يومًا عن الرؤية في بلدك.</p>`;
}

/* الأحداث */
document.addEventListener('click',e=>{
  const g=s=>e.target.closest(s);let x;
  if(x=g('[data-tab]')){show(x.dataset.tab);return}
  if(x=g('[data-o]')){const[s,a]=x.dataset.o.split(':').map(Number);openS(s,a);return}
  if(g('[data-dl]')){download();return}
  if(g('#bk')){READ=null;rQuran();scrollTo(0,0);return}
  if(g('#fp')||g('#fm')){const f=Math.min(54,Math.max(20,LS.get('fs',28)+(g('#fp')?2:-2)));LS.set('fs',f);document.documentElement.style.setProperty('--f',f+'px');return}
  if(x=g('.ay')){if(READ){LS.set('last',{s:READ.s,a:+x.dataset.a});toast('تم حفظ موضع القراءة: آية '+A(x.dataset.a));x.classList.add('hl');setTimeout(()=>x.classList.remove('hl'),1200)}return}
  if(x=g('[data-ac]')){AC=x.dataset.ac;LS.set('adhc',AC);rAdhkar();return}
  if(x=g('[data-ar]')){const a=aProg();delete a[x.dataset.ar];LS.set('adh-'+dk(),a);rAdhkar();return}
  if(x=g('[data-dh]')){const[i,k]=x.dataset.dh.split(':');bump(i,+k);return}
  if(x=g('[data-dd]')){const k='deeds-'+dk(),d=LS.get(k,[]),i=d.indexOf(x.dataset.dd);if(i>=0)d.splice(i,1);else{d.push(x.dataset.dd);buzz([25,20,25])}LS.set(k,d);rDeeds();return}
  if(g('[data-rd]')){if(confirm('مسح ما أنجزته اليوم؟')){LS.set('deeds-'+dk(),[]);rDeeds()}return}
  if(g('#pg')){if(!navigator.geolocation){toast('المتصفح لا يدعم تحديد الموقع');return}navigator.geolocation.getCurrentPosition(p=>{PR={city:PR.city,lat:p.coords.latitude,lng:p.coords.longitude};LS.set('prayer',PR);rPrayer();toast('تم تحديد موقعك')},()=>toast('تعذّر تحديد الموقع، اختر مدينتك'),{timeout:10000});return}
  if(g('#tb')){tap();return}
  if(x=g('[data-tp]')){T.p=+x.dataset.tp;T.c=0;LS.set('tasbih',T);rTasbih();return}
  if(x=g('[data-tg]')){T.tg=+x.dataset.tg;if(T.tg&&T.c>T.tg)T.c=0;LS.set('tasbih',T);rTasbih();return}
  if(g('#tu')){if(T.c>0){T.c--;T.tot[T.p]=Math.max((T.tot[T.p]||1)-1,0);LS.set('tasbih',T);uT()}return}
  if(g('#tr')){T.c=0;LS.set('tasbih',T);uT();return}
  if(g('#th2')){LS.set('hap',!LS.get('hap',true));rTasbih();return}
  if(x=g('[data-cd]')){CS=nn(new Date(+x.dataset.cd));rCal();return}
  if(x=g('[data-cn]')){const v=+x.dataset.cn;if(!v){CR=nn(new Date());CS=nn(new Date())}else{const dd=[...$$('[data-cd]')].map(b=>+b.dataset.cd);CR=v>0?ad(new Date(dd[dd.length-1]),1):ad(new Date(dd[0]),-1);CS=CR}rCal()}
});
document.addEventListener('input',e=>{if(e.target.id==='sf'){const q=norm(L2(e.target.value).replace(/^سورة\s+/,'')),num=/^\d+$/.test(q)?+q:null;$$('.sl li').forEach(li=>li.hidden=q&&!(num!==null?+li.dataset.i===num:li.dataset.n.includes(q)))}});
document.addEventListener('change',e=>{if(e.target.id==='pc'&&CITIES[e.target.value]){PR={city:e.target.value,lat:null,lng:null};LS.set('prayer',PR);rPrayer()}});

function renderAll(){rQuran();rSearch();rAdhkar();rDeeds();rPrayer();rTasbih();rCal()}
(async function(){
  theme();
  if(HF){const n=new Date(),h=hij(n);$('#th').textContent=A(h.d)+' '+HM[h.m-1]+' '+A(h.y)+' هـ';$('#tg').textContent=WD[n.getDay()]+' '+A(n.getDate())+' '+GM[n.getMonth()]+' '+A(n.getFullYear())+' م'}
  try{const d=await idbGet('quran-v1');if(validQ(d))Q=d}catch(e){}
  renderAll();show(LS.get('tab','quran'));
  if(!Q)download();
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
